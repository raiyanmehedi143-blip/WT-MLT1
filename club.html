<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Club Membership</title>
    <style>
        .topnav {
            background-color: #333;
        }

        .topnav a {
            color: white;
            text-decoration: none;
            padding: 14px 16px;
            display: inline-block;
        }

        .topnav span:hover {
            box-shadow: inset 0 0 10px #000000;
        }
    </style>
</head>
<body>
    <style>
        h1 {
            color: rgb(55, 1, 132);
            text-align: center;
        }
    </style>

    <div class="topnav">
        <nav>
            <a href="1.html"><span>Home</span></a>
            <a href="2.html"><span>Events</span></a>
            <a href="3.html"><span>Join</span></a>
        </nav>
    </div>

    <h1>Programming	Club</h1>


    <form action="" method="post">
        <fieldset>
            <legend>Join the Club</legend>
            <label for="full-name">Full Name:</label>
            <input type="test" id="full-name" name="fn" placeholder="Enter your full name" minlength="3" required />
            <br />
            <label for="email">Email:</label>
            <input type="email" id="email" name="em" placeholder="Enter your email" required/>
            <br/>
            <label for="student-id">Student ID:</label>
            <input type="email" id="email" name="em" pattern="[0-9]{2}-[0-9]{5}-[0-9]" placeholder="24-56789-1" required/>
            <br/>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="17" max="40" required />
            <br/>
            <label for="membership-type">Membership	Type</label>
            <input type="radio" name="General" id="General" /> General
            <input type="radio" name="Executive" id="Executive" /> Executive
            <br/>
            <select>
            <option value="">Select	a club</option>
            <option value="programming">Programming</option>
            <option value="robotics">Robotics</option>
            <option value="debate">Debate</option>
            </select>
            <br/>
            <br/>

            <br/>
            <textarea name="comments" id="comments" rows="4" cols="40" placeholder="Write your comment here!">Why do you want to join?</textarea>
            <br/>
            <br/>
            <input type="checkbox" /> I agree to the club rules
            <br/>
            <input type="submit" value="Join Now" />

        </fieldset>
        <br/>
    
</body>
</html>
